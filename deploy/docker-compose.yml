# Pharo Cloud on one GPU machine:
#   fetch-models  downloads the GGUF model(s) from Hugging Face once (merging split files)
#   vllm          serves them (continuous batching: many requests in parallel)
#   gateway       the only public port: limits, metering, admin dashboard
#
#   cp deploy/.env.example deploy/.env   # then edit it
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# llama.cpp instead of vLLM: docker compose --profile llama up -d (and set
# PHARO_CLOUD_UPSTREAMS=http://llama:8080/v1 in .env).

name: pharo-cloud

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  fetch-models:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["node", "src/fetch-models.ts"]
    env_file: .env
    volumes:
      - pharo-data:/data
    restart: "no"

  vllm:
    <<: *gpu
    image: vllm/vllm-openai:${VLLM_VERSION:-latest}
    depends_on:
      fetch-models: { condition: service_completed_successfully }
    env_file: .env
    command:
      - --model=/data/models/${MODEL_ID:-pharo-coder}/model.gguf
      - --tokenizer=${MODEL_TOKENIZER:-Qwen/Qwen2.5-Coder-7B-Instruct}
      - --served-model-name=${MODEL_ID:-pharo-coder}
      - --host=0.0.0.0
      - --port=8000
      - --max-model-len=${MAX_MODEL_LEN:-32768}
      - --max-num-seqs=${MAX_NUM_SEQS:-64}
      - --tensor-parallel-size=${TENSOR_PARALLEL_SIZE:-1}
      - --gpu-memory-utilization=${GPU_MEMORY_UTILIZATION:-0.90}
      - --enable-prefix-caching
      - --api-key=${PHARO_CLOUD_UPSTREAM_API_KEY}
    volumes:
      - pharo-data:/data
      - hf-cache:/root/.cache/huggingface
    ipc: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 300s
      retries: 5

  llama:
    <<: *gpu
    profiles: ["llama"]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    depends_on:
      fetch-models: { condition: service_completed_successfully }
    command:
      - --model=/data/models/${MODEL_ID:-pharo-coder}/model.gguf
      - --alias=${MODEL_ID:-pharo-coder}
      - --host=0.0.0.0
      - --port=8080
      - --ctx-size=${LLAMA_CTX_SIZE:-131072}
      - --parallel=${LLAMA_PARALLEL:-8}
      - --cont-batching
      - --n-gpu-layers=999
      - --metrics
      - --api-key=${PHARO_CLOUD_UPSTREAM_API_KEY}
    volumes:
      - pharo-data:/data
    restart: unless-stopped

  gateway:
    build: { context: .., dockerfile: deploy/Dockerfile }
    depends_on:
      fetch-models: { condition: service_completed_successfully }
    env_file: .env
    environment:
      PHARO_CLOUD_UPSTREAMS: ${PHARO_CLOUD_UPSTREAMS:-http://vllm:8000/v1}
    ports:
      - "${PHARO_CLOUD_PUBLIC_PORT:-8000}:8000"
    volumes:
      - pharo-data:/data
    # nvidia-smi inside the gateway, for the GPU panel of the admin dashboard
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [utility]
    restart: unless-stopped

volumes:
  pharo-data:
  hf-cache:
